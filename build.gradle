apply plugin:'java'
apply plugin:'maven-publish'


group = 'cz.siret.prank'
version = '2.6.0'
description = "Fast Random Forest implementations for Weka. Streamlined version of Fans Supek's FastRandomForest."

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


repositories {

    mavenCentral()
    mavenLocal()

}

jar {
    manifest {
        attributes 'Main-Class': 'cz.siret.prank.ffutils.Main'
    }
}

test {

    testLogging {
        events "failed" // "standardOut", "standardError", "passed", "skipped"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }

    // pass -Dbenchmark=true to enable benchmark tests
    systemProperty 'benchmark', System.getProperty('benchmark')
}

tasks.register('benchmark', Test) {
    description = 'Run prediction speed benchmarks'
    group = 'verification'

    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath

    systemProperty 'benchmark', 'true'
    include '**/PredictionSpeedBenchmark*'

    testLogging {
        events "passed", "failed"
        showStandardStreams = true
    }

    // benchmarks may take a long time
    timeout = Duration.ofMinutes(30)
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

assemble.dependsOn generatePomFileForMavenPublication

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'nz.ac.waikato.cms.weka:weka-dev:3.9.6'
    implementation 'com.carrotsearch:hppc:0.10.0'

    testImplementation 'junit:junit:4.13.2'
}
