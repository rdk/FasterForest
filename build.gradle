apply plugin:'java'
apply plugin:'maven-publish'


group = 'cz.siret.prank'
version = '2.9.0'
description = "Fast Random Forest implementations for Weka. Streamlined version of Fans Supek's FastRandomForest."

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Java 22 source set for Panama FFM native classes
sourceSets {
    java22 {
        java {
            srcDir 'src/main/java22'
        }
    }
}

tasks.named('compileJava22Java') {
    sourceCompatibility = JavaVersion.VERSION_22
    targetCompatibility = JavaVersion.VERSION_22
    options.release = 22
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
}

// Tests compile at Java 22 so they can use Panama FFM APIs directly.
// At runtime the multi-release JAR provides the real native classes.
// java22 output must come BEFORE main output so the real classes
// (with MemorySegment methods) take precedence over the Java 17 stubs.
tasks.named('compileTestJava') {
    sourceCompatibility = JavaVersion.VERSION_22
    targetCompatibility = JavaVersion.VERSION_22
    options.release = 22
    classpath = sourceSets.java22.output + classpath
}


repositories {

    mavenCentral()
    mavenLocal()

}

jar {
    manifest {
        attributes 'Main-Class': 'cz.siret.prank.ffutils.Main'
        attributes 'Multi-Release': 'true'
    }

    into('META-INF/versions/22') {
        from sourceSets.java22.output
    }
}

test {
    // Ensure java22 real classes take precedence over Java 17 stubs at runtime
    classpath = sourceSets.java22.output + classpath

    testLogging {
        events "failed" // "standardOut", "standardError", "passed", "skipped"

        showExceptions true
        exceptionFormat "full"
        showCauses true
        showStackTraces true

        showStandardStreams = false
    }

    // pass -Dbenchmark=true to enable benchmark tests
    systemProperty 'benchmark', System.getProperty('benchmark')

    // Panama FFM requires native access
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('benchmark', Test) {
    description = 'Run prediction speed benchmarks'
    group = 'verification'

    testClassesDirs = testing.suites.test.sources.output.classesDirs
    classpath = testing.suites.test.sources.runtimeClasspath

    systemProperty 'benchmark', 'true'

    // forward bench.* params to the JVM running the tests
    ['bench.numTrees', 'bench.treeDepth', 'bench.measureRounds', 'bench.itersPerRound'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }

    include '**/PredictionSpeedBenchmark*'

    jvmArgs '-server',
            '-Xms512m', '-Xmx2g',
            '-XX:+AlwaysPreTouch',
            '-XX:-TieredCompilation',
            '-XX:+UseParallelGC',
            '--enable-native-access=ALL-UNNAMED'

    testLogging {
        events "passed", "failed"
        showStandardStreams = true
    }

    // benchmarks may take a long time
    timeout = Duration.ofMinutes(30)
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'FasterForest'
            from components.java
        }
    }
}

tasks.register('copyPomToLibs', Copy) {
    dependsOn generatePomFileForMavenPublication
    from generatePomFileForMavenPublication.destination
    into layout.buildDirectory.dir('libs')
    rename { "${project.name}-${project.version}.pom" }
}

assemble.dependsOn copyPomToLibs

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'nz.ac.waikato.cms.weka:weka-dev:3.9.6'
    implementation 'com.carrotsearch:hppc:0.10.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation sourceSets.java22.output
}
